aid: lightning-ai
name: Lightning AI
description: 'Lightning AI is an AI development platform from the team behind PyTorch
  Lightning. It provides cloud AI Studios (persistent GPU-backed development workspaces),
  ephemeral Sandboxes for running untrusted or agent-generated code, multi-node training
  and finetuning, batch and real-time inference deployments, and hosted Model APIs
  that expose frontier LLMs behind an API key. The platform is driven programmatically
  through the lightning-sdk Python SDK, the @lightningai/sdk JavaScript Sandbox SDK,
  and the lightning CLI, and is backed by a family of widely adopted open-source libraries
  including PyTorch Lightning, Lightning Fabric, LitServe, LitData, TorchMetrics and
  Thunder. Lightning AI runs as a fully managed cloud or inside a customer VPC (bring
  your own cloud), and is SOC 2 Type II and HIPAA certified.'
