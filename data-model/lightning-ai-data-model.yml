entities:
- name: Organization
  description: Top-level account that owns teamspaces, members and API keys.
  docs: https://lightning.ai/docs/platform/team-management/organizations
- name: Teamspace
  description: >-
    Collaboration scope inside an organization that owns resources. An API key
    is scoped to a teamspace, and that scoping is how the SDKs select a project.
  docs: https://lightning.ai/docs/platform/team-management/teamspaces
  identified_by: owner/teamspace slug
- name: ApiKey
  description: Credential scoped to a teamspace and a role; prefix sk-lit-.
