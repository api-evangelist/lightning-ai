- name: Studio
  description: Persistent, interactive GPU- or CPU-backed development workspace.
  docs: https://lightning.ai/docs/platform/build/ai-studio
- name: Sandbox
  description: >-
    Ephemeral, isolated Linux environment with its own filesystem, network stack
    and dedicated compute.
  docs: https://lightning.ai/docs/platform/build/sandbox
  states:
  - running
  - stopped
  - paused
  - error
  - shutdown
- name: Snapshot
  description: Saved sandbox filesystem that can be restored into a new sandbox.
- name: Command
  description: A running or finished command executed inside a sandbox.
- name: PtySession
  description: Interactive pseudo-terminal session attached to a sandbox.
- name: NetworkPolicy
  description: Egress firewall policy (allowCidrs) applied to a sandbox at create
    time.
- name: Job
  description: Batch job that runs code in the cloud at scale.
  docs: https://lightning.ai/docs/platform/developers/cli/batch
- name: MultiMachineJob
  description: Multi-node distributed training job (MMT).
  docs: https://lightning.ai/docs/platform/developers/cli/multi-machine
- name: Deployment
  description: Model or app turned into a scalable production service endpoint.
  docs: https://lightning.ai/docs/platform/developers/sdk/deployment
- name: VM
  description: Virtual machine managed through the SDK.
  docs: https://lightning.ai/docs/platform/developers/sdk/vms
- name: Cluster
  description: Compute cluster, including bring-your-own-cloud VPC clusters.
  docs: https://lightning.ai/docs/platform/developers/sdk/clusters
- name: Drive
  description: Persistent storage volume; first 10 GB free, then billed per GB.
  docs: https://lightning.ai/docs/platform/data/drive
- name: Dataset
  description: Managed dataset used by training and data workflows.
  docs: https://lightning.ai/docs/platform/data/datasets
- name: DataConnection
  description: Connection to external cloud storage; not billed as Drive storage.
  docs: https://lightning.ai/docs/platform/data/data-connections
- name: Model
  description: Hosted model served through the Model APIs inference surface.
  docs: https://lightning.ai/docs/platform/inference/model-apis
